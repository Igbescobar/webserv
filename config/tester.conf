server {
    listen 8080;
    server_name tester;

    root www;

    # / must answer to GET request ONLY
    location / {
        allow_methods GET;
    }

    # /post_body must answer anything to POST request with a maxBody of 100
    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    # /directory/ must answer to GET request, 
    # root is YoupiBanane, 
    # search for youpi.bad_extension if no file requested
    # Any file with .bla as extension answers to POST request
    location /directory {
        allow_methods GET POST;
        root YoupiBanane;
        index youpi.bad_extension;
        cgi_pass .bla;
    }
}