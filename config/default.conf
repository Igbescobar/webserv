server {
    listen 80;
    client_max_body_size 20m;
    server_name example.com www.example.com;
    root /var/www/html;
    index index.html index.htm;
}

server {
    listen 8080;
    server_name test.local;
    root /usr/share/nginx/html;
    client_max_body_size 5k; 
    index index.html index.htm;
}
