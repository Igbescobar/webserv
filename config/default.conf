server {
    listen 8080;
    listen 127.0.0.1:8081;

    server_name example.com www.example.com sub.example.com;
    
    root /var/www/html;
    
    index index.html index.htm default.html;
    
    client_max_body_size 20M; 

    error_page 403 404 /errors/40x.html;
    error_page 500 /errors/40x.html;
    error_page 502 503 504 /errors/50x.html;
}

server {
    listen 9000;

    
    server_name test.local;
    
    root /usr/share/nginx/html/;
    
    index index.php;
    
    client_max_body_size 5k; 
}

server {
    listen localhost:8000; 
    
    
    root /srv/site3;
    
    client_max_body_size 1024; 
    
    
    error_page 418 /errors/teapot.html;
}

server {
    listen 8070;

    root /tmp/www;
    index file/with/path.html; 

}
