# Server 1: The "kitchen sink" - testing multiple values and standard formats
server {
    listen 8080;
    listen 127.0.0.1:8081;
    listen 127.0.0.1:8081;

    listen 192.168.1.1; # Should default to port 8080
    server_name example.com www.example.com sub.example.com;
    
    root /var/www/html;
    
    index index.html index.htm default.html;
    
    client_max_body_size 20M; # Uppercase M

    error_page 403 404 /errors/40x.html;
    error_page 500 /errors/40x.html;
    error_page 502 503 504 /errors/50x.html;
}

# Server 2: Minimalist server with different values
server {
    listen 8080;
    listen 9000;

    
    server_name test.local;
    
    root /usr/share/nginx/html/; # Path with trailing slash
    
    index index.php;
    
    client_max_body_size 5k; # lowercase k
}

# Server 3: Testing localhost normalization and missing directives
server {
    listen localhost:8000; # Should normalize to 127.0.0.1:8000
    
    # No server_name directive
    
    root /srv/site3;
    
    client_max_body_size 1024; # No suffix, just bytes
    
    # No index directive
    
    error_page 418 /errors/teapot.html;
}

